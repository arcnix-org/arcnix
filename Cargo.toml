[workspace]
members = ["crates/arcnix-core", "crates/arcnix"]
resolver = "3"

[workspace.package]
version = "0.3.12"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.100"
repository = "https://github.com/arcnix-org/arcnix"
homepage = "https://arcnix.org"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arcnix-core = { version = "0.3.12", path = "crates/arcnix-core" }

[patch.crates-io]
# Read SFTP entry names as wire bytes before deciding which can be displayed.
ssh2 = { path = "vendor/ssh2" }
# Keep the parent resize handler when a child closes.
wry = { git = "https://github.com/tauri-apps/wry", rev = "5006b49b3a643b5544263ff9863b797a810d549b" }
