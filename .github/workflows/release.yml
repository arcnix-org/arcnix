name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: arcnix-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 tools/check_release.py

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml

  binaries:
    name: Build ${{ matrix.platform }}
    needs: [validate, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: windows-amd64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/cargo-cache
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config perl libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: ./.github/actions/windows-build-tools
        if: runner.os == 'Windows'
      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        run: echo 'MACOSX_DEPLOYMENT_TARGET=13.0' >> "$GITHUB_ENV"
      - name: Test native workspace
        run: cargo test --workspace --locked --target ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p arcnix --bin arcnix
      - name: Prepare Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bootstrap = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe'
          Invoke-WebRequest -Uri $url -OutFile $bootstrap
          $expected = 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c'
          if ((Get-FileHash -LiteralPath $bootstrap -Algorithm SHA256).Hash -ne $expected) {
            throw 'Inno Setup download did not match its pinned SHA-256.'
          }
          $compiler = Join-Path $env:RUNNER_TEMP 'inno-6.7.4'
          $arguments = @('/PORTABLE=1', '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="{0}"' -f $compiler))
          $process = Start-Process -FilePath $bootstrap -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath (Join-Path $compiler 'ISCC.exe'))) {
            throw "Inno Setup compiler installation failed ($($process.ExitCode))."
          }
          $compiler >> $env:GITHUB_PATH
      - name: Package application
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            python tools/package_release.py --target '${{ matrix.target }}' --tag "$GITHUB_REF_NAME"
          else
            python3 tools/package_release.py --target '${{ matrix.target }}' --tag "$GITHUB_REF_NAME"
          fi
      - name: Test macOS disk image
        if: runner.os == 'macOS'
        run: bash tools/macos_dmg_smoke.sh "dist/arcnix-$GITHUB_REF_NAME-macos-arm64.dmg" "$GITHUB_REF_NAME"
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/windows_installer_smoke.ps1 -Tag $env:GITHUB_REF_NAME -Scope CurrentUser
          ./tools/windows_installer_smoke.ps1 -Tag $env:GITHUB_REF_NAME -Scope AllUsers
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arcnix-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  github-release:
    name: Publish GitHub Release assets
    needs: [validate, checks, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: arcnix-*
          path: dist
          merge-multiple: true
      - name: Create checksums and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          tag="$GITHUB_REF_NAME"
          stem="arcnix-$tag-windows-amd64"
          setup="$stem-setup.exe"
          portable="$stem.zip"
          dmg="arcnix-$tag-macos-arm64.dmg"
          linux=("arcnix-$tag-linux-amd64.tar.gz" "arcnix-$tag-linux-arm64.tar.gz")
          sha256sum "$setup" "$portable" "$dmg" "${linux[@]}" > SHA256SUMS
          assets=("$setup#Windows x64 installer ($tag)" "$portable#Windows x64 portable ZIP ($tag)"
                  "$dmg#macOS Apple Silicon disk image ($tag)" "${linux[@]}" SHA256SUMS)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            flags=(--verify-tag --title "Arcnix $tag" --generate-notes)
            if [[ "$tag" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$tag" "${assets[@]}" "${flags[@]}"
          fi

  publish:
    name: Publish to crates.io
    if: vars.PUBLISH_CRATES_IO == 'true'
    needs: [validate, checks]
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.0
      - uses: ./.github/actions/cargo-cache
      - uses: ./.github/actions/windows-build-tools
      - name: Publish dependency and desktop crates
        shell: pwsh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          if (-not $env:CARGO_REGISTRY_TOKEN) {
            throw 'Make the CRATES_TOKEN Actions secret available to this repository before pushing a release tag.'
          }
          cargo publish --workspace --locked
