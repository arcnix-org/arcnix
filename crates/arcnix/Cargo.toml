[package]
name = "arcnix"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A friendly desktop workspace for managing servers over SSH"
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["ssh", "sftp", "desktop", "server", "terminal"]
categories = ["gui", "network-programming"]

[[bin]]
name = "arcnix"
path = "src/main.rs"

[dependencies]
portable-pty = "0.9"
flate2 = "1"
hayro = "0.9"
pulldown-cmark = { version = "=0.13.6", default-features = false, features = ["html"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "local-offset"] }
arcnix-core = { workspace = true, features = ["bundled-wallpapers"] }
glory = { version = "0.9.1", default-features = false, features = ["wry"] }
sapid = "0.9.1"
async-channel = "2"
sha2 = "0.10"
ssh2 = { version = "0.9.7", features = ["openssl-on-win32", "vendored-openssl"] }

wry = "=0.57.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
keyring = { version = "3.6.3", features = ["apple-native"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSEvent", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "NSNotification", "NSOperation", "NSString", "block2"] }
tao = "0.37.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(windows)'.dependencies]
keyring-core = "1.0.1"
windows-native-keyring-store = { version = "1.1.0", default-features = false }
libloading = "0.8.9"
directories = "6"
tempfile = "3"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
webview2-com = "=0.39.1"
windows = { version = "0.62.2", features = ["Win32_Security_Cryptography", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.31", default-features = false }
