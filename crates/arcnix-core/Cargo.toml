[package]
name = "arcnix-core"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "SSH and SFTP server management primitives for Arcnix"
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["ssh", "sftp", "server", "management"]
categories = ["network-programming"]

[features]
bundled-wallpapers = []

[dependencies]
trash = "5.4"
percent-encoding = "2"
time = { version = "0.3", features = ["formatting", "local-offset"] }
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
directories = "6"
# WinCNG cannot authenticate Ed25519 keys. Build and statically link OpenSSL
# so the shipped client needs neither system OpenSSL nor the ssh executable.
ssh2 = { version = "0.9.7", features = ["openssl-on-win32", "vendored-openssl"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
tempfile = "3"
getrandom = "0.3"
similar = "3.2.1"
zeroize = "1.8"
base64 = "0.22"
flate2 = "1.1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = "1"
tokio = { version = "1", features = ["rt", "net", "time"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(all(windows, target_env = "msvc"))'.dependencies]
# Expose the vendored OpenSSL install directory to build.rs via DEP_OPENSSL_ROOT.
openssl-sys = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }
